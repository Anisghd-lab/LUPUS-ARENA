name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fix gradle.properties for Linux
        run: |
          sed -i '/org\.gradle\.java\.home/d' android/gradle.properties || true
        working-directory: lupus_arena

      - name: Install Android SDK Platform 31 and CMake 3.22.1
        run: |
          echo "y" | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-31" "cmake;3.22.1"

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation
        working-directory: lupus_arena

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: lupus_arena/build/app/outputs/flutter-apk/app-release.apk
