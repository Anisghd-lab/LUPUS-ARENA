name: Build & Release Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The debug keystore must not be created under the runner config folder.
      ANDROID_USER_HOME: /tmp/android-user-home
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android user directory
        run: mkdir -p "$ANDROID_USER_HOME/.android"
        working-directory: lupus_arena

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons
        working-directory: lupus_arena

      - name: Build Split-per-ABI APKs (32-bit & 64-bit)
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          echo "=== Taille des APKs générés ==="
          ls -lh build/app/outputs/flutter-apk/
        working-directory: lupus_arena

      - name: Prepare Named Release APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/LupusArena.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/LupusArena-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/LupusArena-arm32.apk
          echo "=== Fichiers prêts pour la Release ==="
          ls -lh build/app/outputs/flutter-apk/LupusArena*.apk
        working-directory: lupus_arena

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lupus-arena-apks
          path: |
            lupus_arena/build/app/outputs/flutter-apk/LupusArena.apk
            lupus_arena/build/app/outputs/flutter-apk/LupusArena-arm64.apk
            lupus_arena/build/app/outputs/flutter-apk/LupusArena-arm32.apk

      - name: Determine Version
        run: |
          RAW_VER=$(grep '^version:' lupus_arena/pubspec.yaml | awk '{print $2}')
          echo "APP_VERSION=v$RAW_VER" >> $GITHUB_ENV
          echo "Building version: v$RAW_VER"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Release ${{ env.APP_VERSION }}"
          body: |
            ### 🐺 Lupus Arena - ${{ env.APP_VERSION }}
            - **🌍 Traduction 100% Dynamique (FR / AR / EN)** : Support intégral et instantané de 3 langues (Français, Arabe, Anglais) avec 396 clés de traduction couvrant l'ensemble des 32 rôles, 19 phases, menus, overlays de victoire, vocaux Agora et modales.
            - **✨ Modèle LTR Préservé & Ergonomie Homogène** : L'affichage en Arabe conserve strictement la disposition et les boutons du modèle français sans inversion de layout (clean & responsive).
            - **🚩 Sélection Obligatoire au 1er Lancement** : Boîte de dialogue Dark Fantasy interactive au premier démarrage de l'app avec drapeaux (🇫🇷, 🇩🇿, 🇬🇧) et persistance SharedPreferences.
            - **🚀 Système Autonome d'Auto-Mise à Jour In-App** : Détection 100% automatique des nouvelles versions via l'API GitHub Releases (`/releases/latest`), comparaison sémantique de versions (SemVer + build number), bandeau de mise à jour dynamique dans le Lobby, dialogue modal avec affichage du changelog GitHub, barre de progression interactive en temps réel (`LinearProgressIndicator` avec Dio), et déclenchement immédiat de l'installation Android native via `open_filex` et `FileProvider`.
            - **🔄 Bouton Interactif 'Rejouer' & Compteur Dynamique `(prêts/total)`** : Vote interactif de fin de partie avec bascule d'état visuel ("Rejouer" <-> "Prêt"), émission de `player_ready_replay` / `player_cancel_replay`, et synchro temps réel via `replay_status_updated`.
            - **🎲 Mélange Fisher-Yates & Redistribution Impérative des Rôles** : Dès quorum atteint, le serveur génère un deck adapté (Loup Blanc, Loup Noir, Voyante, Sorcière, Chasseur, Villageois...), le brasse via l'algorithme de Fisher-Yates, et attribue à chaque joueur un rôle distinct et différent avant d'émettre `game_reset_to_lobby`.
            - **❤️ Réinitialisation Canonique des Joueurs** : Restauration complète des statistiques (`PV = 100`, `isAlive = true`, `isMuted = false`), réinitialisation des cibles nocturnes et retour synchronisé au salon.
            - **🎙️ Minute Vocale Collective à la Victoire (60s)** : Canal vocal général ouvert à tous (morts et vivants), compte à rebours visuel et coupure générale à 0s.
            - **🔒 Entrée Unique & Anti-Doublon** : Reconnexion transparente avec mise à jour du `socketId` sans doublon de joueur.
            - **🐺 Pouvoir du Loup Noir & Voyante / Loup Blanc** : Rôles nocturnes conformes aux règles officielles.
            
            📲 **Installation recommandée** : Téléchargez et installez simplement **`LupusArena.apk`** (compatible avec tous les téléphones Android récents).
          draft: false
          prerelease: false
          files: |
            lupus_arena/build/app/outputs/flutter-apk/LupusArena.apk
            lupus_arena/build/app/outputs/flutter-apk/LupusArena-arm64.apk
            lupus_arena/build/app/outputs/flutter-apk/LupusArena-arm32.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
