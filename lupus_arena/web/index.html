<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <link rel="apple-touch-icon" href="icons/lupus_seal.png?v=3">

  <link rel="icon" type="image/png" sizes="512x512" href="icons/lupus_seal.png?v=3"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=3"/>
  <link rel="icon" type="image/png" href="icons/lupus_seal.png?v=3"/>
