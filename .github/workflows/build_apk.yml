name: Build & Release Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The debug keystore must not be created under the runner config folder.
      ANDROID_USER_HOME: /tmp/android-user-home
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android user directory
        run: mkdir -p "$ANDROID_USER_HOME/.android"
        working-directory: lupus_arena

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Build Split-per-ABI APKs (32-bit & 64-bit)
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          echo "=== Taille des APKs générés ==="
          ls -lh build/app/outputs/flutter-apk/
        working-directory: lupus_arena

      - name: Prepare Named Release APKs
        run: |
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/LupusArena-arm32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/LupusArena-arm64.apk
          echo "=== Fichiers prêts pour la Release ==="
          ls -lh build/app/outputs/flutter-apk/LupusArena-arm32.apk build/app/outputs/flutter-apk/LupusArena-arm64.apk
        working-directory: lupus_arena

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lupus-arena-apks
          path: |
            lupus_arena/build/app/outputs/flutter-apk/LupusArena-arm32.apk
            lupus_arena/build/app/outputs/flutter-apk/LupusArena-arm64.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0+1
          name: "Release v1.0.0+1"
          body: "Builds Android optimisés (32-bit et 64-bit séparés pour réduire la taille de l'APK)."
          draft: false
          prerelease: false
          files: |
            lupus_arena/build/app/outputs/flutter-apk/LupusArena-arm32.apk
            lupus_arena/build/app/outputs/flutter-apk/LupusArena-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
