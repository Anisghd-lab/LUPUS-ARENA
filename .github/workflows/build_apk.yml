name: Build & Release Flutter APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality_check:
    name: Contrôle Qualité (Analyse & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos
        working-directory: lupus_arena

      - name: Tests unitaires critiques de non-régression
        run: flutter test
        working-directory: lupus_arena

  build:
    name: Compilation Multi-ABI & Release
    needs: quality_check
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /tmp/android-user-home
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android user directory
        run: mkdir -p "$ANDROID_USER_HOME/.android"
        working-directory: lupus_arena

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons
        working-directory: lupus_arena

      - name: Prepare Release Assets Directory
        run: mkdir -p release_assets
        working-directory: lupus_arena

      - name: Build Universal APK
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/LupusArena.apk
        working-directory: lupus_arena

      - name: Build Split-per-ABI APKs (32-bit, 64-bit, x86_64)
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/LupusArena-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_assets/LupusArena-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_assets/LupusArena-x86_64.apk
          echo "=== Taille des APKs générés ==="
          ls -lh release_assets/
        working-directory: lupus_arena

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lupus-arena-apks
          path: lupus_arena/release_assets/LupusArena*.apk

      - name: Determine Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER=$(grep '^version:' lupus_arena/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            TAG="v$RAW_VER"
          fi
          echo "APP_VERSION=$TAG" >> $GITHUB_ENV
          echo "Building version: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Lupus Arena ${{ env.APP_VERSION }}"
          body: |
            ### 🐺 Lupus Arena - ${{ env.APP_VERSION }} (Refonte Palette du Lobby, Ergonomie Compacte & Boutons d'Action)

            Mise à jour dédiée à l'ergonomie et au design du lobby, intégrant les nouvelles teintes runiques et néon extraites de l'illustration officielle :

            #### 🌟 Nouveautés & Améliorations Clés :
            - **🎨 Boutons d'Action Néon & Runiques (`LobbyActionButtons`)** :
              - **Créer un Salon** : Dégradé vertical Mauve néon mystique (`#C040FB` vers `#5E178E`), bordure luminescente (`#E28BFF`) et ombre portée diffuse.
              - **Rejoindre** : Dégradé vertical Vert électrique runique (`#64DD17` vers `#1B5E20`), bordure vert menthe (`#B9F6CA`) et projection d'ombre runique.
              - **Code du Salon** : Conteneur sombre semi-transparent (`#0E1326`) aux dimensions coordonnées avec bordure discrète violette/ardoise.
              - **Gabarit Unifié** : Normalisation stricte des dimensions (`height: 50`, `width: 300`, `borderRadius: 14`) et empilement vertical centré.
            - **📱 Top Bar & Ergonomie Compacte** :
              - **Capsule Profil Joueur** : Remplacement du sélecteur encombrant par une capsule compacte (avatar, pseudo et crayon d'édition rapide) sans libellé redondant.
              - **Bouton Langue Épuré** : Bouton circulaire 38px avec icône globe 🌐 unique, sans code texte ni drapeau.
              - **Badge de Mise à Jour Compact** : Format capsule pill avec badge « NEW » dynamique remplaçant l'ancienne bannière.

            ---
            #### 📲 Binaires Téléchargeables :
            * **`LupusArena.apk`** : Paquet **Universel** (recommandé par défaut, compatible avec tous les téléphones Android).
            * **`LupusArena-arm64.apk`** : Paquet optimisé **64-bit** (taille réduite, smartphones récents).
            * **`LupusArena-arm32.apk`** : Paquet optimisé **32-bit** (anciens smartphones Android).
            * **`LupusArena-x86_64.apk`** : Paquet optimisé **x86_64** (émulateurs et Chromebooks).
          draft: false
          prerelease: false
          files: |
            lupus_arena/release_assets/LupusArena.apk
            lupus_arena/release_assets/LupusArena-arm64.apk
            lupus_arena/release_assets/LupusArena-arm32.apk
            lupus_arena/release_assets/LupusArena-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
