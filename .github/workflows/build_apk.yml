name: Build & Release Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The debug keystore must not be created under the runner config folder.
      ANDROID_USER_HOME: /tmp/android-user-home
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android user directory
        run: mkdir -p "$ANDROID_USER_HOME/.android"
        working-directory: lupus_arena

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Build Split-per-ABI APKs (32-bit & 64-bit)
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          echo "=== Taille des APKs générés ==="
          ls -lh build/app/outputs/flutter-apk/
        working-directory: lupus_arena

      - name: Prepare Named Release APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/LupusArena.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/LupusArena-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/LupusArena-arm32.apk
          echo "=== Fichiers prêts pour la Release ==="
          ls -lh build/app/outputs/flutter-apk/LupusArena*.apk
        working-directory: lupus_arena

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lupus-arena-apks
          path: |
            lupus_arena/build/app/outputs/flutter-apk/LupusArena.apk
            lupus_arena/build/app/outputs/flutter-apk/LupusArena-arm64.apk
            lupus_arena/build/app/outputs/flutter-apk/LupusArena-arm32.apk

      - name: Determine Version
        run: |
          RAW_VER=$(grep '^version:' lupus_arena/pubspec.yaml | awk '{print $2}')
          echo "APP_VERSION=v$RAW_VER" >> $GITHUB_ENV
          echo "Building version: v$RAW_VER"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Release ${{ env.APP_VERSION }}"
          body: |
            ### 🐺 Lupus Arena - ${{ env.APP_VERSION }}
            - **🎙️ Minute Vocale Collective à la Victoire (60s)** : Dès l'annonce de la victoire (`gameOver`), ouverture automatique d'un canal vocal général à TOUS les joueurs (morts et vivants). Compte à rebours visuel dynamique avec barre de progression, et coupure automatique des micros à l'expiration de la minute.
            - **🔒 Entrée Unique & Anti-Doublon** : Remplacement transparent du socket (`socketId`) et du flux vocal lors des reconnexions sans créer d'entrée dupliquée dans le salon, avec préservation stricte des rôles et statuts.
            - **🐺 Pouvoir du Loup Noir** : Sélection nocturne d'une cible pour la réduire au silence (micro coupé et champ de saisie de chat désactivé) pour l'intégralité du jour suivant.
            - **🔮 Voyante & Loup Blanc** : Perception mystique conforme aux règles officielles : inspection du Loup Blanc renvoyant Simple Villageois.
            - **📱 Interface de Salon Responsive** : Arrière-plan étendu en plein écran avec `StackFit.expand` et intégration bord à bord sans bande noire.
            
            📲 **Installation recommandée** : Téléchargez et installez simplement **`LupusArena.apk`** (compatible avec tous les téléphones Android récents).
          draft: false
          prerelease: false
          files: |
            lupus_arena/build/app/outputs/flutter-apk/LupusArena.apk
            lupus_arena/build/app/outputs/flutter-apk/LupusArena-arm64.apk
            lupus_arena/build/app/outputs/flutter-apk/LupusArena-arm32.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
