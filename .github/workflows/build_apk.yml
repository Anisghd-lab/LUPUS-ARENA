name: Build & Release Flutter APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality_check:
    name: Contrôle Qualité (Analyse & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos
        working-directory: lupus_arena

      - name: Tests unitaires critiques de non-régression
        run: flutter test
        working-directory: lupus_arena

  build:
    name: Compilation Multi-ABI & Release
    needs: quality_check
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /tmp/android-user-home
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android user directory
        run: mkdir -p "$ANDROID_USER_HOME/.android"
        working-directory: lupus_arena

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons
        working-directory: lupus_arena

      - name: Prepare Release Assets Directory
        run: mkdir -p release_assets
        working-directory: lupus_arena

      - name: Build Universal APK
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/LupusArena.apk
        working-directory: lupus_arena

      - name: Build Split-per-ABI APKs (32-bit, 64-bit, x86_64)
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/LupusArena-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_assets/LupusArena-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_assets/LupusArena-x86_64.apk
          echo "=== Taille des APKs générés ==="
          ls -lh release_assets/
        working-directory: lupus_arena

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lupus-arena-apks
          path: lupus_arena/release_assets/LupusArena*.apk

      - name: Determine Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER=$(grep '^version:' lupus_arena/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            TAG="v$RAW_VER"
          fi
          echo "APP_VERSION=$TAG" >> $GITHUB_ENV
          echo "Building version: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Lupus Arena ${{ env.APP_VERSION }}"
          body: |
            ### 🐺 Lupus Arena - ${{ env.APP_VERSION }} (Repositionnement Boutons X · Thème Dark Fantasy / Runes · Logo Loup Officiel)

            #### 🌟 Nouveautés & Améliorations

            **📍 Déplacement des Boutons d'Action (Emplacement X)**
            - Boutons descendus vers le bas (`bottom: 110 dp`), pile au-dessus du grand cercle runique violet au sol.
            - Le corps complet du loup-garou et son socle rocheux sont désormais 100% dégagés et visibles.
            - Prise en compte dynamique du clavier (`viewInsets.bottom`) pour la saisie du code sans masquage.

            **🎨 Refonte Thème Dark Fantasy & Runes**
            - **CRÉER UN SALON** : Dégradé profond obsidienne violacée & mauve lunaire (`#5A1E8A` → `#2E0D4E` → `#16062A`), liseré ciselé doré/bronze antique (`#E5C158`) et icône croissant de lune dorée (`Icons.nights_stay_rounded`).
            - **CODE DU SALON** : Style pierre taillée / ardoise runique sobre (`#1E2330` → `#121622` → `#0A0D15`) avec contour fer forgé runique.
            - **REJOINDRE** : Dégradé vert spectral sombre (`#14532D` → `#072E1B` → `#03190E`), bordure émeraude spectrale (`#34D399`) et icône patte/griffes de loup (`Icons.pets_rounded`).

            **👤 Capsule Profil Joueur**
            - Intégration du véritable logo officiel du jeu (tête de loup runique `lupus_seal.png`) en 28×28 dp.
            - Suppression complète de l'icône crayon d'édition.
            - Nom du joueur conservé en typographie dorée arcane serif.

            ---
            #### 📲 Binaires Téléchargeables
            * **`LupusArena.apk`** — Universel (recommandé)
            * **`LupusArena-arm64.apk`** — 64-bit (smartphones récents)
            * **`LupusArena-arm32.apk`** — 32-bit (anciens smartphones)
            * **`LupusArena-x86_64.apk`** — x86_64 (émulateurs)
          draft: false
          prerelease: false
          files: |
            lupus_arena/release_assets/LupusArena.apk
            lupus_arena/release_assets/LupusArena-arm64.apk
            lupus_arena/release_assets/LupusArena-arm32.apk
            lupus_arena/release_assets/LupusArena-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
