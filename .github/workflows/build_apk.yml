name: Build & Release Flutter APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality_check:
    name: Contrôle Qualité (Analyse & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos
        working-directory: lupus_arena

      - name: Tests unitaires critiques de non-régression
        run: flutter test test/werewolf_mechanics_test.dart
        working-directory: lupus_arena

  build:
    name: Compilation Multi-ABI & Release
    needs: quality_check
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /tmp/android-user-home
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android user directory
        run: mkdir -p "$ANDROID_USER_HOME/.android"
        working-directory: lupus_arena

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons
        working-directory: lupus_arena

      - name: Build Universal APK
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
        working-directory: lupus_arena

      - name: Build Split-per-ABI APKs (32-bit, 64-bit, x86_64)
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          echo "=== Taille des APKs générés ==="
          ls -lh build/app/outputs/flutter-apk/
        working-directory: lupus_arena

      - name: Prepare Named Release APKs
        run: |
          mkdir -p release_assets
          # 1. APK Universel (Toutes architectures)
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/LupusArena.apk
          # 2. APK ARM 64-bit (Smartphones récents)
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/LupusArena-arm64.apk
          # 3. APK ARM 32-bit (Smartphones 32-bit)
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_assets/LupusArena-arm32.apk
          # 4. APK x86_64 (Émulateurs / Chromebooks)
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_assets/LupusArena-x86_64.apk

          echo "=== Fichiers prêts pour la Release ==="
          ls -lh release_assets/
        working-directory: lupus_arena

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lupus-arena-apks
          path: lupus_arena/release_assets/LupusArena*.apk

      - name: Determine Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER=$(grep '^version:' lupus_arena/pubspec.yaml | awk '{print $2}')
            TAG="v$RAW_VER"
          fi
          echo "APP_VERSION=$TAG" >> $GITHUB_ENV
          echo "Building version: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Release ${{ env.APP_VERSION }}"
          body: |
            ### 🐺 Lupus Arena - ${{ env.APP_VERSION }}

            Mise à jour majeure : Scrutin diurne 15s eager avec voix double du Capitaine, Succession du Capitaine (Testament 10s), Résolution composite de la Sorcière, Déduplication stricte Firebase & Agora, et Cinématique 3D de révélation des défunts au centre de la table.

            #### 🌟 Points Forts & Nouveautés :
            - **🗳️ Scrutin Diurne Eager (15s)** : Dépouillement immédiat dès que tous les vivants ont voté, application instantanée de la sentence et révélation publique du rôle d'origine. Poids = 2 pour le vote du Capitaine.
            - **🎖️ Succession du Capitaine (Testament 10s)** : À sa mort, le Capitaine dispose d'une fenêtre d'agonie de 10s pour désigner son successeur via un panneau interactif dédié. Passation automatique d'office si le temps expire ou en cas de déconnexion.
            - **🧪 Résolution Composite de la Sorcière** : Affichage exclusif de la victime de la meute à la Sorcière vivante. Choix combinables de Potion de Vie (sauver) et Potion de Mort (empoisonner). Décrémentation stricte et déchéance en Simple Villageois dès épuisement des 2 potions.
            - **🔥 Architecture Firebase & Déduplication Agora Anti-Doublons** : Indexation stricte par ID utilisateur `/rooms/{roomId}/players/{userId}` éliminant les sessions fantômes et PushID aléatoires. Déconnexion préalable systématique du canal RTC Agora avant toute reconnexion pour éviter le rejet par les serveurs Agora.
            - **🎴 Cinématique 3D de Révélation au Centre du Cercle** : Confinement strict de l'overlay au vide central de la table radiale (largeur <= 95px, hauteur <= 140px) préservant la visibilité des joueurs. Révélation séquentielle FIFO avec retournement 3D (0° à 180°), exposition statique de 2s et disparition fluide.
            - **🧪 Suite Complète de Tests Automatisés** : Validation à 100% des mécaniques moteur Kotlin (`NouvellesFonctionnalitesReleaseTest`), de la déduplication client (`game_room_deduplication_test.dart`) et des widgets UI (`captain_succession_and_flip_card_test.dart`).

            ---
            #### 📲 Binaires Téléchargeables :
            * **`LupusArena.apk`** : Paquet **Universel** (recommandé par défaut, compatible avec tous les téléphones Android).
            * **`LupusArena-arm64.apk`** : Paquet optimisé **64-bit** (taille réduite, smartphones récents).
            * **`LupusArena-arm32.apk`** : Paquet optimisé **32-bit** (anciens smartphones Android).
            * **`LupusArena-x86_64.apk`** : Paquet optimisé **x86_64** (émulateurs et Chromebooks).
          draft: false
          prerelease: false
          files: |
            lupus_arena/release_assets/LupusArena.apk
            lupus_arena/release_assets/LupusArena-arm64.apk
            lupus_arena/release_assets/LupusArena-arm32.apk
            lupus_arena/release_assets/LupusArena-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
