org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true
org.gradle.vfs.watch=false
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=true

# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Force Gradle to use Adoptium JDK 17 LTS
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.12.7-hotspot

# Disable automatic SDK/NDK download to prevent buggy sdkmanager.bat crash on Windows
android.builder.sdkDownload=false

# Force target platform to android-arm to prevent Windows 64-bit Dart heap allocation crash (Error 87)
target-platform=android-arm

# Allow legacy third-party plugins (like unity_ads_plugin) with Java 1.8 to compile alongside Kotlin 17
kotlin.jvm.target.validation.mode=warning
