name: Build & Release Flutter APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality_check:
    name: Contrôle Qualité (Analyse & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos
        working-directory: lupus_arena

      - name: Tests unitaires critiques de non-régression
        run: flutter test
        working-directory: lupus_arena

  build:
    name: Compilation Multi-ABI & Release
    needs: quality_check
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /tmp/android-user-home
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android user directory
        run: mkdir -p "$ANDROID_USER_HOME/.android"
        working-directory: lupus_arena

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons
        working-directory: lupus_arena

      - name: Prepare Release Assets Directory
        run: mkdir -p release_assets
        working-directory: lupus_arena

      - name: Build Universal APK
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/LupusArena.apk
        working-directory: lupus_arena

      - name: Build Split-per-ABI APKs (32-bit, 64-bit, x86_64)
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/LupusArena-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_assets/LupusArena-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_assets/LupusArena-x86_64.apk
          echo "=== Taille des APKs générés ==="
          ls -lh release_assets/
        working-directory: lupus_arena

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lupus-arena-apks
          path: lupus_arena/release_assets/LupusArena*.apk

      - name: Determine Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER=$(grep '^version:' lupus_arena/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            TAG="v$RAW_VER"
          fi
          echo "APP_VERSION=$TAG" >> $GITHUB_ENV
          echo "Building version: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Lupus Arena ${{ env.APP_VERSION }}"
          body: |
            ### 🐺 Lupus Arena - ${{ env.APP_VERSION }} (Stabilisation Multijoueur & Sécurité Réseau)

            Mise à jour majeure de robustesse multijoueur, sécurité serveur et résilience réseau suite à l'audit senior complet :

            #### 🌟 Nouveautés & Corrections Majeures :
            - **🛡️ Failover & Déconnexion d'Hôte (LA-003)** : Détection temps réel de la déconnexion ou du crash de l'hôte, passation automatique et reprise immédiate des minuteurs serveur sans interruption ni gel de partie.
            - **🔄 Revanche & Rematch Atomique (LA-004)** : Élimination définitive de la race condition lors du clic simultané sur "Rejouer", quorum exclusif à l'Hôte avec verrou mutex anti-double reset, et correction des chemins de rôles secrets.
            - **🔐 Règles de Sécurité & Validation Serveur Firebase RTDB (LA-005)** : Règles `.validate` serveur actives empêchant les rollbacks de tour, verrouillant le cimetière et interdisant les votes aux défunts.
            - **⚖️ Dépouillement Autoritaire & Consensus de Meute (LA-007)** : Dépouillement diurne et élection du Maire basés sur une lecture directe autoritaire Firebase (`votes.get()`), et calcul de consensus majoritaire pour la chasse nocturne des loups.
            - **🧹 Réinitialisation Automatique & Synchronisation Atomique** : Purge systématique et atomique de tous les votes, sélections de cibles et visions de voyante à chaque transition de phase ou de cycle nocturne.

            ---
            #### 📲 Binaires Téléchargeables :
            * **`LupusArena.apk`** : Paquet **Universel** (recommandé par défaut, compatible avec tous les téléphones Android).
            * **`LupusArena-arm64.apk`** : Paquet optimisé **64-bit** (taille réduite, smartphones récents).
            * **`LupusArena-arm32.apk`** : Paquet optimisé **32-bit** (anciens smartphones Android).
            * **`LupusArena-x86_64.apk`** : Paquet optimisé **x86_64** (émulateurs et Chromebooks).
          draft: false
          prerelease: false
          files: |
            lupus_arena/release_assets/LupusArena.apk
            lupus_arena/release_assets/LupusArena-arm64.apk
            lupus_arena/release_assets/LupusArena-arm32.apk
            lupus_arena/release_assets/LupusArena-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
