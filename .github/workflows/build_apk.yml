name: Build & Release Flutter APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality_check:
    name: Contrôle Qualité (Analyse & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos
        working-directory: lupus_arena

      - name: Tests unitaires critiques de non-régression
        run: flutter test test/werewolf_mechanics_test.dart
        working-directory: lupus_arena

  build:
    name: Compilation Multi-ABI & Release
    needs: quality_check
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /tmp/android-user-home
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android user directory
        run: mkdir -p "$ANDROID_USER_HOME/.android"
        working-directory: lupus_arena

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons
        working-directory: lupus_arena

      - name: Build Universal APK
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
        working-directory: lupus_arena

      - name: Build Split-per-ABI APKs (32-bit, 64-bit, x86_64)
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          echo "=== Taille des APKs générés ==="
          ls -lh build/app/outputs/flutter-apk/
        working-directory: lupus_arena

      - name: Prepare Named Release APKs
        run: |
          mkdir -p release_assets
          # 1. APK Universel (Toutes architectures)
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/LupusArena.apk
          # 2. APK ARM 64-bit (Smartphones récents)
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/LupusArena-arm64.apk
          # 3. APK ARM 32-bit (Smartphones 32-bit)
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_assets/LupusArena-arm32.apk
          # 4. APK x86_64 (Émulateurs / Chromebooks)
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_assets/LupusArena-x86_64.apk

          echo "=== Fichiers prêts pour la Release ==="
          ls -lh release_assets/
        working-directory: lupus_arena

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lupus-arena-apks
          path: lupus_arena/release_assets/LupusArena*.apk

      - name: Determine Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER=$(grep '^version:' lupus_arena/pubspec.yaml | awk '{print $2}')
            TAG="v$RAW_VER"
          fi
          echo "APP_VERSION=$TAG" >> $GITHUB_ENV
          echo "Building version: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Release ${{ env.APP_VERSION }}"
          body: |
            ### 🐺 Lupus Arena - ${{ env.APP_VERSION }}

            Mise à jour majeure : Mécanique officielle de double action nocturne des loups, bluff intra-meute & auto-mutisme, saut automatique au débat et parité absolue Room & God Mode.

            #### 🌟 Points Forts & Nouveautés :
            - **🐺 Double Action Nocturne Obligatoire** : Les loups doivent obligatoirement désigner 1 proie à dévorer ET 1 joueur vivant à réduire au silence. Le bouton de validation reste verrouillé tant que les deux cibles distinctes ne sont pas validées.
            - **🎭 Bluff Intra-Meute & Auto-Mutisme Stratégique** : Les loups peuvent réduire au silence n'importe quel joueur vivant, y compris un complice (Loup-Garou ou Loup Blanc) ou s'auto-museler eux-mêmes pour parfaire leur alibi d'innocent. Seule interdiction stricte : museler la proie dévorée de la nuit.
            - **🔇 Débat Diurne & Saut de Parole Instantané** : Le joueur sous silence (loup ou villageois) hérite de `isMuted`, voit son micro Agora verrouillé, affiche son badge de mute rouge et son tour de parole est sauté automatiquement sans aucun temps mort lors du débat.
            - **👑 Parité Isomorphique Room & God Mode** : Intégration dans le panneau Maître du Jeu d'une carte de diagnostic de double action en temps réel, de boutons directs de morsure et de silence nocturne, et d'un forçage d'avance de débat respectant l'exclusion des muets.
            - **🧹 Cycle de Vie & Purge Automatique du Silence** : Levée du bâillon au crépuscule/fin de vote et purge systématique lors de tout saut arbitraire vers une phase nocturne.

            ---
            #### 📲 Binaires Téléchargeables :
            * **`LupusArena.apk`** : Paquet **Universel** (recommandé par défaut, compatible avec tous les téléphones Android).
            * **`LupusArena-arm64.apk`** : Paquet optimisé **64-bit** (taille réduite, smartphones récents).
            * **`LupusArena-arm32.apk`** : Paquet optimisé **32-bit** (anciens smartphones Android).
            * **`LupusArena-x86_64.apk`** : Paquet optimisé **x86_64** (émulateurs et Chromebooks).
          draft: false
          prerelease: false
          files: |
            lupus_arena/release_assets/LupusArena.apk
            lupus_arena/release_assets/LupusArena-arm64.apk
            lupus_arena/release_assets/LupusArena-arm32.apk
            lupus_arena/release_assets/LupusArena-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
